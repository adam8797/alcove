name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Alcove.slnx

      - name: Build
        run: dotnet build Alcove.slnx --no-restore --configuration Release

      # The integration tests pack the fixture plugins against a local feed. They take third-party packages
      # read-only from NUGET_PACKAGES, which the restore above has populated.
      - name: Test
        run: dotnet test Alcove.slnx --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: TestResults/

      - name: Upload packages
        uses: actions/upload-artifact@v3
        with:
          name: packages
          path: artifacts/packages/Release/*.nupkg
